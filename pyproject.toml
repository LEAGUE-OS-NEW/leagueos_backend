[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | htmlcov
  | staticfiles
  | media
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "DJ",
]

ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts",
    "authentication",
    "config",
    "markets",
    "sports",
    "system",
]
