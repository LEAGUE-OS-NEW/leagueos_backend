name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

# Preserve completed validation on protected/base branches.
# New commits to an open PR may cancel an obsolete PR run, but pushes to
# develop/main are allowed to finish so long-running full suites are not lost.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, format, validate and test
    runs-on: ubuntu-latest
    # Full backend validation includes a growing integration/financial suite.
    # Three hours provides substantial growth headroom without hiding hangs.
    timeout-minutes: 180

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leagueos_ci
          POSTGRES_USER: leagueos
          POSTGRES_PASSWORD: leagueos_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leagueos -d leagueos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: github-actions-ci-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://leagueos:leagueos_ci_password@localhost:5432/leagueos_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Run Ruff lint checks
        run: ruff check --no-cache .

      - name: Run Black formatting check
        run: black --check --diff .

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Validate OpenAPI schema
        run: >
          python manage.py spectacular
          --file /tmp/leagueos-openapi.yml
          --validate
          --fail-on-warn

      - name: Run tests
        run: >
          pytest
          --cov=accounts
          --cov=authentication
          --cov=discovery
          --cov=fantasy
          --cov=markets
          --cov=sports
          --cov=system
          --cov=profiles
          --cov-report=term-missing
          --cov-report=xml
