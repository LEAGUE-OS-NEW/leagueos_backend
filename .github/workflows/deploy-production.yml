name: Deploy Production

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: league-os-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to DigitalOcean
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/league_os_production

          chmod 600 ~/.ssh/league_os_production

          ssh-keyscan -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts

      - name: Deploy production
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/league_os_production \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'sudo /opt/league-os/deploy.sh'
