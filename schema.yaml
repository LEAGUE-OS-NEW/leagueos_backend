components:
  schemas:
    Avatar:
      type: object
      description: Serializer for returning avatar metadata and URL.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        avatar:
          type: string
          format: uri
          readOnly: true
          nullable: true
        avatar_url:
          type: string
          nullable: true
          readOnly: true
        avatar_updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - avatar
      - avatar_updated_at
      - avatar_url
      - id
    ChannelCapability:
      type: object
      description: Serializer for channel capabilities.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel:
          type: string
          format: uuid
          readOnly: true
        channel_name:
          type: string
          readOnly: true
        channel_code:
          type: string
          readOnly: true
        capability:
          type: string
          readOnly: true
        is_supported:
          type: boolean
          readOnly: true
      required:
      - capability
      - channel
      - channel_code
      - channel_name
      - id
      - is_supported
    Club:
      type: object
      description: Serializer for the Club model.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        founded:
          type: integer
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - founded
      - id
      - is_active
      - name
      - slug
    ClubCatalogue:
      type: object
      description: Serializer for the club preference catalogue.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        founded:
          type: integer
          readOnly: true
          nullable: true
      required:
      - founded
      - id
      - name
      - slug
    ClubSelection:
      type: object
      description: |-
        Serializer for selecting favourite clubs during onboarding.

        Validates that each club is active and belongs to one of the user's
        selected competitions (when the club is linked to a competition).
      properties:
        club_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - club_ids
    CommunicationConsent:
      type: object
      description: |-
        Serializer for communication consent records.

        Read-only - consents are created via dedicated endpoints.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        consent_type:
          allOf:
          - $ref: '#/components/schemas/ConsentTypeEnum'
          readOnly: true
        granted:
          type: boolean
          readOnly: true
        granted_at:
