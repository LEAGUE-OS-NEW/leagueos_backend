  /api/v1/clubs/:
    get:
      operationId: clubs_list
      description: Public club list.
      parameters:
      - in: query
        name: country
        schema:
          type: string
          maxLength: 2
          minLength: 1
      - in: query
        name: ordering
        schema:
          enum:
          - name
          - -name
          - founded
          - -founded
          type: string
          default: name
          minLength: 1
        description: |-
          * `name` - name
          * `-name` - -name
          * `founded` - founded
          * `-founded` - -founded
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          maxLength: 180
      - in: query
        name: sport
        schema:
          type: string
          format: uuid
      tags:
      - Discovery
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDiscoveryClubList'
          description: ''
