    NotificationPreferenceAuditActionEnum:
      enum:
      - NOTIFICATION_PREFERENCES_VIEWED
      - NOTIFICATION_PREFERENCES_UPDATED
      - CHANNEL_ENABLED
      - CHANNEL_DISABLED
      - QUIET_HOURS_UPDATED
      - QUIET_HOURS_DISABLED
      - CONSENT_GRANTED
      - CONSENT_WITHDRAWN
      - RESET_TO_DEFAULTS
      - MANDATORY_NOTIFICATION_SENT
      type: string
      description: |-
        * `NOTIFICATION_PREFERENCES_VIEWED` - Notification preferences viewed
        * `NOTIFICATION_PREFERENCES_UPDATED` - Notification preferences updated
        * `CHANNEL_ENABLED` - Channel enabled
        * `CHANNEL_DISABLED` - Channel disabled
        * `QUIET_HOURS_UPDATED` - Quiet hours updated
        * `QUIET_HOURS_DISABLED` - Quiet hours disabled
        * `CONSENT_GRANTED` - Consent granted
        * `CONSENT_WITHDRAWN` - Consent withdrawn
        * `RESET_TO_DEFAULTS` - Reset to defaults
        * `MANDATORY_NOTIFICATION_SENT` - Mandatory notification sent
    NotificationSeverityEnum:
      enum:
      - INFO
      - WARNING
      - CRITICAL
      type: string
      description: |-
        * `INFO` - Information
        * `WARNING` - Warning
        * `CRITICAL` - Critical
