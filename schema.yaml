          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarketAdminWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarketAdminWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketAdminRead'
          description: ''
