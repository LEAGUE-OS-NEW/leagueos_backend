      - SERIES
      - OTHER
      type: string
      description: |-
        * `MATCH` - Match
        * `RACE` - Race
        * `TOURNAMENT` - Tournament
        * `BOUT` - Bout
        * `SERIES` - Series
        * `OTHER` - Other
    StepEnum:
      enum:
      - COUNTRY
      - SPORTS
      - COMPETITIONS
      - CLUBS
      type: string
      description: |-
        * `COUNTRY` - COUNTRY
        * `SPORTS` - SPORTS
        * `COMPETITIONS` - COMPETITIONS
        * `CLUBS` - CLUBS
    Suggestion:
      type: object
      description: A single search suggestion.
      properties:
        suggestion_type:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        display_name:
          type: string
      required:
      - display_name
      - entity_id
      - entity_type
      - suggestion_type
    TimeInForceEnum:
      enum:
      - GTC
      - GTD
      - IOC
      - FOK
      type: string
      description: |-
        * `GTC` - Good till cancelled
        * `GTD` - Good till date
        * `IOC` - Immediate or cancel
        * `FOK` - Fill or kill
    Timezone:
