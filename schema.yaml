  /api/v1/market-admin/markets/:
    get:
      operationId: api_v1_market_admin_markets_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: scope_type
        schema:
          enum:
          - EVENT
          - COMPETITION
          - PARTICIPANT
          - CUSTOM
          type: string
          minLength: 1
        description: |-
          * `EVENT` - Sporting event
          * `COMPETITION` - Competition
          * `PARTICIPANT` - Participant
          * `CUSTOM` - Custom proposition
      - in: query
        name: search
        schema:
          type: string
          maxLength: 255
          minLength: 1
      - in: query
        name: sport
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          enum:
          - DRAFT
          - PENDING_APPROVAL
          - APPROVED
          - OPEN
          - SUSPENDED
          - CLOSED
          - RESOLVED
          - VOIDED
          - REJECTED
          type: string
          minLength: 1
        description: |-
          * `DRAFT` - Draft
          * `PENDING_APPROVAL` - Pending approval
          * `APPROVED` - Approved
          * `OPEN` - Open
          * `SUSPENDED` - Suspended
          * `CLOSED` - Closed
          * `RESOLVED` - Resolved
          * `VOIDED` - Voided
          * `REJECTED` - Rejected
      tags:
      - Market Administration
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMarketAdminReadList'
          description: ''
    post:
      operationId: api_v1_market_admin_markets_create
