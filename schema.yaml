  /api/v1/markets/{market_id}/outcomes/{outcome_id}/price-history/:
    get:
      operationId: markets_outcomes_price_history_retrieve
      description: Read-only executed-price history from immutable fills. RAW limit
        means executed fill points. HOUR and DAY limits mean complete OHLCV buckets.
        HOUR requests are bounded to 31 days and DAY requests to 730 days. Buckets
        use the configured Africa/Kampala timezone. Open-order quotes, current mutable
        prices and unmatched bids are excluded.
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date-time
      - in: query
        name: interval
        schema:
          enum:
          - RAW
          - HOUR
          - DAY
          type: string
          default: RAW
          minLength: 1
        description: |-
          * `RAW` - RAW
          * `HOUR` - HOUR
          * `DAY` - DAY
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
      - in: path
        name: market_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: outcome_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date-time
      tags:
      - Markets
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPriceHistoryResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistoryError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistoryError'
          description: ''
