      description: Public fixture list.
      parameters:
      - in: query
        name: club
        schema:
          type: string
          format: uuid
      - in: query
        name: competition
        schema:
          type: string
          format: uuid
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
      - in: query
        name: ordering
        schema:
          enum:
          - starts_at
          - -starts_at
          - name
          - -name
          type: string
          default: starts_at
          minLength: 1
        description: |-
          * `starts_at` - starts_at
          * `-starts_at` - -starts_at
          * `name` - name
          * `-name` - -name
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: sport
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          enum:
          - DRAFT
          - SCHEDULED
          - LIVE
          - COMPLETED
          - POSTPONED
          - CANCELLED
          - ABANDONED
          type: string
          minLength: 1
        description: |-
          * `DRAFT` - Draft
          * `SCHEDULED` - Scheduled
          * `LIVE` - Live
          * `COMPLETED` - Completed
          * `POSTPONED` - Postponed
          * `CANCELLED` - Cancelled
          * `ABANDONED` - Abandoned
      tags:
      - Discovery
      security:
      - jwtAuth: []
      - {}
      responses:
