          type: string
          readOnly: true
        utc_offset:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - id
      - is_active
      - timezone_name
      - utc_offset
    TokenRefresh:
      type: object
      properties:
