components:
  schemas:
    Adjustment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reason:
          type: string
          readOnly: true
        evidence_reference:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        market:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        mismatch:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        proposed_by:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ComplianceDecisionStatusEnum'
          readOnly: true
        executed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/AdjustmentLine'
          readOnly: true
      required:
      - created_at
      - currency
      - evidence_reference
      - executed_at
      - id
      - lines
      - market
      - mismatch
      - proposed_by
      - reason
      - status
    AdjustmentDecision:
      type: object
      properties:
        notes:
          type: string
    AdjustmentLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        wallet:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/DirectionEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
        idempotency_reference:
          type: string
          format: uuid
        wallet_ledger_entry:
          type: string
          format: uuid
          nullable: true
      required:
      - amount
      - direction
      - id
      - idempotency_reference
      - wallet
    AdjustmentLineInput:
      type: object
      properties:
        wallet_id:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/DirectionEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
      required:
      - amount
      - direction
      - wallet_id
    AdjustmentProposal:
      type: object
      properties:
        reason:
          type: string
        evidence_reference:
          type: string
        currency:
          type: string
          default: UGX
          maxLength: 3
        market:
          type: string
          format: uuid
          nullable: true
        mismatch:
          type: string
          format: uuid
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/AdjustmentLineInput'
      required:
      - evidence_reference
      - lines
      - reason
    AdminComplianceDetail:
      type: object
      properties:
        eligible:
          type: boolean
        evaluated_at:
          type: string
          format: date-time
        requirements:
          type: object
          additionalProperties: {}
        reason_codes:
          type: array
          items:
            type: string
        next_actions:
          type: array
          items:
            type: string
        participant_id:
          type: string
          format: uuid
        date_of_birth:
          type: string
          format: date
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        jurisdiction_override_reason:
          type: string
        internal_review_notes:
          type: string
      required:
      - date_of_birth
      - eligible
      - evaluated_at
      - internal_review_notes
      - jurisdiction_override_reason
      - next_actions
      - participant_id
      - reason_codes
      - requirements
      - reviewed_at
      - reviewed_by
    AdminKYCSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        participant_id:
          type: string
          format: uuid
          readOnly: true
        provider_code:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/KYCVerificationStatusEnum'
        verification_level:
          type: string
          maxLength: 50
        initiated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        last_event_at:
          type: string
          format: date-time
          nullable: true
        failure_code:
          type: string
          maxLength: 100
      required:
      - expires_at
      - id
      - participant_id
      - provider_code
    AdminKYCSessionDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        participant_id:
          type: string
          format: uuid
          readOnly: true
        provider_code:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/KYCVerificationStatusEnum'
        verification_level:
          type: string
          maxLength: 50
        initiated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        last_event_at:
          type: string
          format: date-time
          nullable: true
        failure_code:
          type: string
          maxLength: 100
        events:
          type: array
          items:
            $ref: '#/components/schemas/SafeKYCEvent'
          readOnly: true
      required:
      - events
      - expires_at
      - id
      - participant_id
      - provider_code
    AdminResponsibleStatus:
      type: object
      properties:
        limits:
          $ref: '#/components/schemas/Limits'
