      - channel
      - created_at
      - id
      - updated_at
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        is_verified:
          type: boolean
        roles:
          type: array
          items:
            type: string
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - email
      - id
      - permissions
      - roles
      - username
    UserRegistration:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone_number:
          type: string
          nullable: true
        password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_password:
          type: string
          writeOnly: true
