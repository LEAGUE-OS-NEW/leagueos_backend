  /api/v1/markets/:
    get:
      operationId: api_v1_markets_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          format: uuid
      - in: query
        name: is_featured
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: scope_type
        schema:
          enum:
          - EVENT
          - COMPETITION
          - PARTICIPANT
          - CUSTOM
          type: string
          minLength: 1
        description: |-
          * `EVENT` - Sporting event
          * `COMPETITION` - Competition
          * `PARTICIPANT` - Participant
          * `CUSTOM` - Custom proposition
      - in: query
        name: search
        schema:
          type: string
          maxLength: 255
          minLength: 1
      - in: query
        name: sport
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          enum:
          - OPEN
          - SUSPENDED
          - CLOSED
          - RESOLVED
          - VOIDED
          type: string
          default: OPEN
          minLength: 1
        description: |-
          * `OPEN` - OPEN
          * `SUSPENDED` - SUSPENDED
          * `CLOSED` - CLOSED
          * `RESOLVED` - RESOLVED
          * `VOIDED` - VOIDED
