openapi: 3.0.3
info:
  title: League OS API
  version: 1.0.0
  description: Sports, fantasy, ticketing and markets platform API
paths:
  /api/v1/:
    get:
      operationId: api_v1_retrieve
      description: |-
        Get dashboard data for the current user.

        Returns:
            Complete dashboard response with user summary, navigation,
            widgets, module data, and recommendations.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/analytics/:
    post:
      operationId: api_v1_analytics_create
      description: |-
        Record analytics event.

        Request body:
            - module: Module code (required)
            - widget: Widget code (optional)
            - interaction_type: Type of interaction (required)
            - metadata: Additional metadata (optional)

        Returns:
            Success response
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardAnalyticsCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DashboardAnalyticsCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DashboardAnalyticsCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAnalyticsCreate'
          description: ''
